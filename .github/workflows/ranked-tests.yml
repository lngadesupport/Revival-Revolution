name: Ranked backend tests

on:
  push:
    branches: [ main, "feature/ranked-match-backend*", "release/0.8.1-stabilization", "feature/0.8.1-radmin-room-start" ]
    paths:
      - "ranked_server/**"
      - "tests/**"
      - "peer_session.py"
      - "autopunch_transport.py"
      - "selection_sync.py"
      - "live_fighter.py"
      - "peer_native.py"
      - "bridge_command.py"
      - ".github/workflows/ranked-tests.yml"
  pull_request:
    paths:
      - "ranked_server/**"
      - "tests/**"
      - ".github/workflows/ranked-tests.yml"
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Ranked and multiplayer Python modules
        run: python -m compileall -q ranked_server tests peer_session.py autopunch_transport.py selection_sync.py live_fighter.py peer_native.py bridge_command.py
      - name: Run unit and peer protocol tests
        run: python -m unittest discover -s tests -v
