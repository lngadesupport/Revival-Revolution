name: Build Windows launcher

on:
  push:
    branches: [ main, feature/modern-wpf-launcher, feature/ranked-match-backend-v2, release/0.8.1-stabilization, ops/windows-local-ranked-host, feature/0.8.1-radmin-room-start ]
    paths:
      - "launcher/RevivalRevolutionLauncher/**"
      - "scripts/start-radmin-ranked-host.ps1"
      - "scripts/enable-radmin-peer-firewall.ps1"
      - "tests/LauncherIntegritySmoke/**"
      - ".github/workflows/build-launcher.yml"
      - ".github/workflows/publish-launcher-release.yml"
  pull_request:
    paths:
      - "launcher/RevivalRevolutionLauncher/**"
      - "scripts/start-radmin-ranked-host.ps1"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate Radmin PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @(".\scripts\start-radmin-ranked-host.ps1", ".\scripts\enable-radmin-peer-firewall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
          }
      - name: Restore
        run: dotnet restore .\launcher\RevivalRevolutionLauncher\RevivalRevolutionLauncher.csproj
      - name: Build
        run: dotnet build .\launcher\RevivalRevolutionLauncher\RevivalRevolutionLauncher.csproj --configuration Release --no-restore
      - name: Run launcher integrity smoke tests
        run: dotnet run --project .\tests\LauncherIntegritySmoke\LauncherIntegritySmoke.csproj --configuration Release
      - name: Publish self-contained Windows x64
        run: dotnet publish .\launcher\RevivalRevolutionLauncher\RevivalRevolutionLauncher.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\RevivalRevolution-win-x64
      - name: Verify published files
        shell: pwsh
        run: |
          $publish = ".\artifacts\RevivalRevolution-win-x64"
          $exePath = Join-Path $publish "RevivalRevolution.exe"
          if (!(Test-Path $exePath)) { throw "Launcher executable missing from publish output." }
          $fileVersion = (Get-Item $exePath).VersionInfo.FileVersion
          if ($fileVersion -ne "0.8.1.0") { throw "Expected launcher FileVersion 0.8.1.0, got $fileVersion." }
          $configPath = Join-Path $publish "launcher-update.json"
          if (!(Test-Path $configPath)) { throw "Updater configuration missing from publish output." }
          foreach ($asset in @("Assets/metal-revolution-background.jpg", "Assets/metal-revolution-logo.png")) {
            if (!(Test-Path (Join-Path $publish $asset))) { throw "Required launcher asset missing from publish output: $asset" }
          }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.manifestUrl -ne "https://github.com/lngadesupport/Revival-Revolution/releases/latest/download/launcher-update.json") { throw "Updater manifest URL is not the official GitHub Releases endpoint." }
      - name: Upload Windows launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevivalRevolution-win-x64
          path: .\artifacts\RevivalRevolution-win-x64\
          if-no-files-found: error
          retention-days: 14
