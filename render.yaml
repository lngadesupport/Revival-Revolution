services:
  - type: web
    name: revival-revolution-ranked
    runtime: python
    branch: release/0.8.1-stabilization
    plan: 0.5c-512mb
    autoDeployTrigger: checksPass
    buildCommand: python -m compileall -q ranked_server scripts && python -m unittest discover -s tests
    startCommand: python -m ranked_server --host 0.0.0.0 --port $PORT --database /var/data/ranked.sqlite3
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    disk:
      name: revival-ranked-data
      mountPath: /var/data
      sizeGB: 1
